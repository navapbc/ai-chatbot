name: Evals

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'lib/ai/**'
      - 'evals/**'
      - 'app/(chat)/api/chat/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/evals.yml'

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-evals:
    name: Run Braintrust evals
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
      BRAINTRUST_PARENT: project_name:labs-asp
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if Braintrust key is unset
        if: env.BRAINTRUST_API_KEY == ''
        run: |
          echo "::warning::BRAINTRUST_API_KEY is not configured for this repo — skipping eval run."
          echo "Add BRAINTRUST_API_KEY and OPENAI_API_KEY as repo secrets to enable PR evals."
          exit 0

      - uses: pnpm/action-setup@v4
        if: env.BRAINTRUST_API_KEY != ''
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        if: env.BRAINTRUST_API_KEY != ''
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        if: env.BRAINTRUST_API_KEY != ''
        run: pnpm install --frozen-lockfile

      - name: Run Braintrust evals
        if: env.BRAINTRUST_API_KEY != ''
        run: pnpm eval:ci
